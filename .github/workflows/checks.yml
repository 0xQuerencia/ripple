name: Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: ./node_modules/.bin/esbuild workers/index.mjs --bundle --platform=browser --format=esm --target=es2022 --external:cloudflare:workers --external:node:* --outfile=/tmp/ripple-cloudflare.mjs
      - run: node --check server/index.mjs
      - run: cp .env.private.example .env.private && docker compose -f docker-compose.private.yml config --quiet
      - run: npm run evaluate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
